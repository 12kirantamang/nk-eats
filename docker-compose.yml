services:
  app:
    build:
      context: ./php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: nk_eats_app
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: nk_eats_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nk_eats
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: Asia/Tokyo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - nk-eats-db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    container_name: nk_eats_phpmyadmin
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: password

volumes:
  nk-eats-db-data:
